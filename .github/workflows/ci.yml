name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (package)
        run: uv run mypy nvme_sentinel

      - name: Mypy (package + tests)
        run: uv run mypy nvme_sentinel tests

  # nvme_sentinel HAL/adapters — library checks only. Product gate is test-openmw.
  test-nvme-sentinel:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Pytest (nvme_sentinel)
        run: uv run pytest -n auto tests/unit tests/integration -q

      - name: Demo smoke test
        run: uv run nvme-sentinel demo

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/

  # Profiler/ has its own pyproject.toml / uv.lock. nvme-sentinel comes from the repo root.
  test-profiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync Profiler dependencies
        working-directory: Profiler
        run: uv sync --all-extras --dev

      - name: Pytest Profiler
        working-directory: Profiler
        run: uv run pytest -q

  # apps/shell node --test. Node 22: the test script passes a glob, and node --test
  # expands globs from Node 21 on. Electron 35 is built on Node 22. The tests use
  # node builtins only, so the Electron binary is not downloaded.
  test-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json

      - name: Install dependencies
        working-directory: apps/shell
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Test
        working-directory: apps/shell
        run: npm test

  # Product gate: OpenMW has its own pyproject.toml / uv.lock (cryptography, etc.).
  test-openmw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync OpenMW dependencies
        working-directory: OpenMW
        run: uv sync --all-extras --dev

      - name: Pytest OpenMW + openvault coverage gate
        working-directory: OpenMW
        run: >
          uv run pytest tests -q
          --cov=openmw.openvault
          --cov-report=term-missing
          --cov-fail-under=75

  # apps/web npm test. Node 20: no .nvmrc and no engines field.
  test-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Test
        working-directory: apps/web
        run: npm test
