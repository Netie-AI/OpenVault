# ──────────────────────────────────────────────────────────
# From-source override for the SELF-HOSTED stack.
#
# docker/docker-compose.yml now builds api, dashboard and edge from this
# repository by default, so this file adds nothing. It is kept so existing
# command lines keep working:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.build.yml \
#     --env-file .env up -d --build
#
# `context: ..` points the build at the REPO ROOT since this file lives in docker/.
# ──────────────────────────────────────────────────────────

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile

  edge:
    build:
      context: ..
      dockerfile: apps/edge/Dockerfile
