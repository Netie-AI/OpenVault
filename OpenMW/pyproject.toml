[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmw"
version = "0.1.0"
description = "Open measurement workspace: flash KV-cache offload + profiler correlation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "nvme-sentinel",
  "nvme-profiler",
  # pytest-cov + numpy 2.4+ re-inits _multiarray_umath (PEP 489) and collection
  # dies with ImportError. scipy 1.16+ then trips _CopyMode.IF_NEEDED on reload.
  "numpy>=1.26,<2.3",
  "scipy>=1.11,<1.16",
  "pydantic>=2.5",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "psutil>=7.2.2",
  "nvidia-ml-py>=12",
  "huggingface-hub>=1.20.0",
  "typer>=0.12",
  "fastapi>=0.139.2",
  "uvicorn[standard]>=0.51.0",
  "httpx>=0.28.1",
  "cryptography>=49.0.0",
  "redis>=5",
  "python-multipart>=0.0.32",
]

[project.scripts]
openmw = "openmw.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "mypy>=1.10",
  "ruff>=0.6",
  "fakeredis>=2.23",
  "lupa>=2.0",
  "pytest-cov>=7.1.0",
]

[tool.uv.sources]
nvme-sentinel = { path = "..", editable = true }
nvme-profiler = { path = "../Profiler", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openmw"]

[tool.hatch.build.targets.wheel.force-include]
"openmw/data/models.json" = "openmw/data/models.json"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["nvme_sentinel.*", "nvme_profiler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openmw.vendor.turboquant.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pynvml", "psutil", "huggingface_hub", "huggingface_hub.*", "tqdm", "tqdm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "starlette", "starlette.*", "uvicorn", "uvicorn.*", "httpx", "cryptography", "cryptography.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["unsloth", "unsloth.*", "datasets", "datasets.*", "trl", "trl.*"]
ignore_missing_imports = true

# Keep pytest rootdir inside OpenMW so the parent nvme_sentinel pyproject
# does not steal config when CI runs `working-directory: OpenMW`.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.optional-dependencies]
training = []
