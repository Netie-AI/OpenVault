[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmw"
version = "0.1.0"
description = "Open measurement workspace: flash KV-cache offload + profiler correlation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "nvme-sentinel",
  "nvme-profiler",
  # pytest-cov + numpy 2.4+ re-inits _multiarray_umath (PEP 489) and collection
  # dies with ImportError.
  "numpy>=1.26,<2.3",
  "pydantic>=2.5",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "psutil>=7.2.2",
  "nvidia-ml-py>=12",
  "huggingface-hub>=1.20.0",
  "typer>=0.12",
  "fastapi>=0.139.2",
  "uvicorn[standard]>=0.51.0",
  "httpx>=0.28.1",
  "cryptography>=49.0.0",
  "tomli>=2.0.1",
  "redis>=5",
  "python-multipart>=0.0.32",
  # zoneinfo has no IANA database on stock Windows; quota.window_bounds (chat
  # routing, /api/freeroute/status) needs one. Linux and macOS ship their own.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
openmw = "openmw.cli:app"

[project.entry-points.pytest11]
openmw_numpy_preload = "openmw.pytest_numpy_preload"

[dependency-groups]
dev = [
  "pytest>=8",
  "mypy>=1.10",
  "ruff>=0.6",
  "fakeredis>=2.23",
  "lupa>=2.0",
  "pytest-cov>=7.1.0",
]

[tool.uv.sources]
nvme-sentinel = { path = "..", editable = true }
nvme-profiler = { path = "../Profiler", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openmw"]

[tool.hatch.build.targets.wheel.force-include]
"openmw/data/models.json" = "openmw/data/models.json"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["nvme_sentinel.*", "nvme_profiler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openmw.vendor.turboquant.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pynvml", "psutil", "huggingface_hub", "huggingface_hub.*", "tqdm", "tqdm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "starlette", "starlette.*", "uvicorn", "uvicorn.*", "httpx", "cryptography", "cryptography.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["unsloth", "unsloth.*", "datasets", "datasets.*", "trl", "trl.*"]
ignore_missing_imports = true

# Keep pytest rootdir inside OpenMW so the parent nvme_sentinel pyproject
# does not steal config when CI runs `working-directory: OpenMW`.
# Do not add pythonpath=["."] -- that plus the installed package loads openmw
# twice and numpy 2.x warns/reloads C extensions under pytest-cov.
[tool.pytest.ini_options]
testpaths = ["tests"]
# A module that cannot be imported is a FAILING module, not a missing one (R-0002),
# but it must not veto the suite. Without this, one uncollectable module aborts
# collection for every file, so vault tests silently never run while the
# documented clone-and-verify command still looks like it did something.
# Collection errors are reported by name and the run still exits non-zero
# (R-0001, R-0011). scipy is not a dependency: nothing in this tree imports it,
# so the old scipy<1.16 DLL pin is gone. The numpy cap above stays.
addopts = ["--continue-on-collection-errors"]

[project.optional-dependencies]
training = []
